<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Be The Change Admin</title>
  <link rel="icon" href="../Frontend/assets/uploads/2025/02/fav.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-page">
    <div class="login-card-container">
      <form class="login-card" id="login-form" novalidate>
        <div class="login-card-header">
          <div class="login-kicker-badge">
            <i class="bi bi-sliders2"></i>
            <span>Admin CMS</span>
          </div>
          <h2>Welcome back</h2>
          <p class="login-subtitle">Sign in to edit published website content.</p>
        </div>

        <div class="alert alert-danger py-2 px-3 mb-3" id="login-error" hidden></div>

        <div class="login-form-group mb-3">
          <label class="form-label-admin" for="email">Email address</label>
          <div class="input-with-icon">
            <i class="bi bi-envelope input-leading-icon"></i>
            <input class="form-control login-input" type="email" id="email" name="email" value="admin@bethechangehealth.com" autocomplete="username" placeholder="name@bethechangehealth.com" required>
          </div>
        </div>

        <div class="login-form-group mb-3">
          <label class="form-label-admin" for="password">Password</label>
          <div class="input-with-icon">
            <i class="bi bi-lock input-leading-icon"></i>
            <input class="form-control login-input" type="password" id="password" name="password" value="••••••••" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="btn-password-toggle" id="password-toggle" aria-label="Toggle password visibility" tabindex="-1">
              <i class="bi bi-eye" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <div class="login-options-row d-flex justify-content-between align-items-center mb-4">
          <label class="form-check custom-checkbox-wrap mb-0" for="remember-device">
            <input class="form-check-input" type="checkbox" id="remember-device" checked>
            <span class="custom-checkbox-text">Remember this device</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-btc btn-login-submit w-100" id="login-submit-btn">
          <span>Sign in to CMS</span>
          <i class="bi bi-arrow-right"></i>
        </button>

        <div class="login-card-footer mt-4">
          <p class="help mb-0">
            <i class="bi bi-shield-lock"></i>
            <span>UI-only access. Sign in opens the CMS dashboard.</span>
          </p>
        </div>
      </form>
    </div>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
