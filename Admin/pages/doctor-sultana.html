<body data-page="doctor-sultana">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
          <div>
            <p class="section-map mb-1">Frontend · about/sultana-afrooz.html</p>
            <p class="text-muted mb-0">Sticky photo card + biography. Also used on homepage doctor cards.</p>
          </div>
          <span class="badge-admin badge-published">Published</span>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card-admin">
              <div class="card-head"><div><h2>Profile card</h2><p>doctor-card-sticky</p></div></div>
              <div class="card-body-admin">
                <div class="upload-box mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2024/10/Sultana-Afrooz-pd6ddd2kete2du2tyy24v5o7z1bhnurc6jbos2s6lk.png" alt="Sultana Afrooz">
                  <p>Replace profile portrait</p>
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">List / homepage thumbnail</label>
                <div class="upload-box compact mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2024/08/sa.jpg" alt="Thumbnail">
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">Display name</label>
                <input class="form-control mb-2" value="Sultana Afrooz, D.O.">
                <label class="form-label-admin">Hero name</label>
                <input class="form-control mb-2" value="Sultana J Afrooz, D.O.">
                <label class="form-label-admin">Title</label>
                <input class="form-control mb-2" value="Integrative Family Medicine Physician & Osteopathic Physician">
                <label class="form-label-admin">Location line</label>
                <input class="form-control" value="located in Columbia, MD">
                <label class="form-check mt-3">
                  <input class="form-check-input" type="checkbox" checked> Show Request An Appointment button
                </label>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card-admin mb-4">
              <div class="card-head"><div><h2>About Dr. Afrooz</h2></div></div>
              <div class="card-body-admin">
                <textarea class="form-control mb-3" rows="6">Sultana Afrooz, DO, is a holistic and integrative medicine physician at Be The Change Health & Wellness, located in Columbia, Maryland. Dr. Afrooz specializes in diagnosing and treating highly complex health challenges confronting many patients and providing them with the in-depth, compassionate, and individualized care they deserve. Dr. Afrooz has practiced osteopathic medicine since receiving her doctorate from Des Moines University – Osteopathic Medical Center in Des Moines, Iowa, in 2002.</textarea>
                <textarea class="form-control mb-3" rows="5">She has successfully completed the National Board of Osteopathic Medical Examiners NBOME Part I, II, III Boards, the State Osteopathic Licensing Examination, and is licensed to practice medicine in Maryland, Pennsylvania, and Georgia. Dr. Afrooz utilizes the best available integrative laboratory evaluations to get to the root cause of disease.</textarea>
                <textarea class="form-control" rows="5">Dr. Sultana Afrooz specializes in treating patients who have been chronically ill from the effects of tick-borne infection, mold toxicity, and environmental toxicity. She uses an integrative approach with prescription antimicrobials, herbal supplements, and nutritional supplements.</textarea>
              </div>
            </div>
            <div class="card-admin">
              <div class="card-head"><div><h2>Cross links</h2></div></div>
              <div class="card-body-admin row g-3">
                <div class="col-md-4"><input class="form-control" value="Request An Appointment"></div>
                <div class="col-md-4"><input class="form-control" value="Meet Dr. Needle"></div>
                <div class="col-md-4"><input class="form-control" value="Our Practice"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="sticky-actions">
          <button class="btn-btc" type="button" data-save="Dr. Afrooz profile saved.">Save profile</button>
          <a class="btn-btc-outline" href="doctor-jessica.html">Edit Dr. Needle</a>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>

</html>
