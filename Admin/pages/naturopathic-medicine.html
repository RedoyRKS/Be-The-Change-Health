              <div class="card-body-admin">
                <textarea class="form-control mb-3" rows="5">Naturopathic Medicine is evidence-based medicine that treats the whole person by addressing the root cause(s) of illness and emphasizes prevention of illness. Naturopathic doctors educate and empower patients to be the leaders and decision-makers of their own health.</textarea>
