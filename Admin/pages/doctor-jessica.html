<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jessica Needle | Be The Change Admin</title>
  <link rel="icon" href="../../Frontend/assets/uploads/2025/02/fav.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="doctor-jessica">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
          <div>
            <p class="section-map mb-1">Frontend · about/jessica-needle.html</p>
            <p class="text-muted mb-0">Sticky card, biography, and three info panels (modalities, conditions, populations).</p>
          </div>
          <span class="badge-admin badge-published">Published</span>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card-admin">
              <div class="card-head"><div><h2>Profile card</h2></div></div>
              <div class="card-body-admin">
                <div class="upload-box mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2025/02/jessica.jpg" alt="Jessica Needle">
                  <p>Replace jessica.jpg</p>
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">List thumbnail</label>
                <div class="upload-box compact mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2025/02/jn-5.jpg" alt="Thumbnail">
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">Display name</label>
                <input class="form-control mb-2" value="Jessica Needle, N.D.">
                <label class="form-label-admin">Title</label>
                <input class="form-control" value="Naturopathic Doctor">
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card-admin mb-4">
              <div class="card-head"><div><h2>About Dr. Needle</h2></div></div>
              <div class="card-body-admin">
                <textarea class="form-control mb-3" rows="3">Jessica Needle received her bachelor’s degree in psychology from Mills College in Oakland, CA, and her doctorate in naturopathic medicine from Bastyr University in Kenmore, WA.</textarea>
                <textarea class="form-control mb-3" rows="3">Prior to becoming a naturopath, Dr. Needle worked as a soft tissue therapist for a chiropractor, as a massage therapy instructor, and in the occupational medicine department of a primary and urgent care facility.</textarea>
                <textarea class="form-control mb-3" rows="3">She completed a post-graduate internship at TrueNorth Health Center, then joined Sedona Wellness Retreat where she guided over 200 patients in nutritional detoxification.</textarea>
                <textarea class="form-control" rows="3">Dr. Needle spent 8 years using I.V. and injection therapy to treat people facing cancer and chronic disease at Optimal Health Center in Palm Desert, CA.</textarea>
              </div>
            </div>
            <div class="card-admin">
              <div class="card-head"><div><h2>Info panels</h2><p>Three columns on the public profile</p></div></div>
              <div class="card-body-admin">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label-admin">Treatment Modalities</label>
                    <textarea class="form-control" rows="12">Diet & Nutrition
Detoxification
Bio-identical Hormones
Nutraceuticals
Food Sensitivities
Micronutrient Testing
Medication Reduction
Homeopathy
Botanical Medicine
Intermittent Fasting
Myofascial Release</textarea>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label-admin">Conditions</label>
                    <textarea class="form-control" rows="12">Digestive Issues
Thyroid Dysfunction
Hormone Imbalance
Metabolic Syndrome
Minor Acute Illnesses
Adjunct Cancer Care</textarea>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label-admin">Populations</label>
                    <textarea class="form-control" rows="12">Teens
Adults
Elders
HIV+</textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="sticky-actions">
          <button class="btn-btc" type="button" data-save="Dr. Needle profile saved.">Save profile</button>
          <a class="btn-btc-outline" href="doctor-sultana.html">Edit Dr. Afrooz</a>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
