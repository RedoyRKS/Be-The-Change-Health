<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header & Footer | Be The Change Admin</title>
  <link rel="icon" href="../../Frontend/assets/uploads/2025/02/fav.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="header-footer">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <p class="section-map">Shared chrome on every Frontend page</p>
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card-admin mb-4">
              <div class="card-head"><div><h2>Top bar</h2><p>Navy strip under the notice bar</p></div></div>
              <div class="card-body-admin">
                <label class="form-label-admin">Location line</label>
                <input class="form-control mb-3" value="Conveniently located in Columbia, MD">
                <label class="form-label-admin">Phone</label>
                <input class="form-control mb-3" value="301-970-9724">
                <label class="form-label-admin">Link 1</label>
                <input class="form-control mb-2" value="Book a Service Online">
                <label class="form-label-admin">Link 2</label>
                <input class="form-control" value="Request An Appointment">
              </div>
            </div>
            <div class="card-admin">
              <div class="card-head"><div><h2>Branding &amp; CTA</h2></div></div>
              <div class="card-body-admin">
                <label class="form-label-admin">Header logo</label>
                <div class="upload-box compact mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2024/08/LOGO.jpg" alt="Logo">
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">CTA button label</label>
                <input class="form-control mb-3" value="Book Appointment">
                <label class="form-label-admin">Main menu items (one per line)</label>
                <textarea class="form-control" rows="8">Home
About
Conditions
Services
Memberships
Blog
Patients
Contact</textarea>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card-admin mb-4">
              <div class="card-head"><div><h2>Footer</h2></div></div>
              <div class="card-body-admin">
                <label class="form-label-admin">Footer logo</label>
                <div class="upload-box compact mb-3">
                  <img class="upload-preview" src="../../Frontend/assets/uploads/2024/08/logo.png" alt="Footer logo">
                  <input type="file" accept="image/*">
                </div>
                <label class="form-label-admin">Address</label>
                <textarea class="form-control mb-3" rows="2">8808 Centre Park Drive Suite 301
Columbia, MD 21045</textarea>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label-admin">Phone</label><input class="form-control" value="301-970-9724"></div>
                  <div class="col-md-6"><label class="form-label-admin">Fax</label><input class="form-control" value="301-359-1986"></div>
                </div>
                <label class="form-label-admin mt-3">Hours</label>
                <textarea class="form-control mb-3" rows="2">Monday – Friday: 9am – 6pm
Saturday & Sunday: Closed</textarea>
                <label class="form-label-admin">Copyright</label>
                <input class="form-control" value="© 2026 Be The Change Health & Wellness Center All Rights Reserved">
              </div>
            </div>
            <div class="card-admin">
              <div class="card-head"><div><h2>Footer columns</h2></div></div>
              <div class="card-body-admin row g-3">
                <div class="col-md-4">
                  <label class="form-label-admin">Explore</label>
                  <textarea class="form-control" rows="6">Home
Our Practice
Our Process
Memberships
Blog</textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label-admin">Care</label>
                  <textarea class="form-control" rows="6">Conditions
Services
Patients
New Patient Questions
Contact
Book Appointment</textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label-admin">Legal</label>
                  <textarea class="form-control" rows="4">Privacy Policy
Terms & Conditions</textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="sticky-actions">
          <button class="btn-btc" type="button" data-save="Header and footer settings saved.">Save chrome settings</button>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
